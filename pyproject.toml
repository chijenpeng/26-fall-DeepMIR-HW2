[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepmir-hw2"
version = "0.1.0"
description = "POP909 symbolic music generation and melody-conditioned accompaniment"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.5,<3",
  "transformers==4.57.1",
  "numpy>=1.26,<3",
  "pretty-midi==0.2.11",
  "tqdm>=4.66,<5",
]

[project.scripts]
deepmir = "deepmir_hw2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

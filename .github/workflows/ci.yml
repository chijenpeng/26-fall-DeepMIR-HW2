name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-experiments.txt
            pyproject.toml
      - name: Install CPU-only verification environment
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-experiments.txt
      - name: Fetch pinned MusDr metric implementation
        run: |
          git clone https://github.com/slSeanWU/MusDr.git third_party/MusDr
          git -C third_party/MusDr checkout b034cf86550963cf2021299eafb1001d0fe34853
      - name: Lint and formatting
        run: |
          ruff check src tests
          ruff format --check src tests
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Unit and synthetic integration tests
        run: pytest -q
